name: ci

on:
  push:
    branches: [main]
    paths:
      - "quant-stack/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "quant-stack/**"

defaults:
  run:
    working-directory: quant-stack

jobs:
  quality:
    name: lint + types + security + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync deps (with dev)
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy --strict
        run: uv run mypy .

      - name: Bandit
        run: uv run bandit -r . -ll --exclude tests

      - name: Pytest
        run: uv run pytest -q
